{% extends "auth_base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<h1>Iniciar sesión</h1>
<p class="sub">Accede a tu inventario con VisionStock.</p>

<div class="card"><div class="card-body">
  {% if error %}<div class="alert-box">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="username">Usuario</label>
      <input type="text" name="username" id="username" value="{{ username }}" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" name="password" id="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn block">Entrar</button>
  </form>
</div></div>

<p class="foot">¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate</a></p>
{% endblock %}
