{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Acceso{% endblock %} · VisionStock</title>
  <script>document.documentElement.classList.add('js');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=2">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="logo">{% include 'layouts/logo.svg' %}</div>
      {% block content %}{% endblock %}
    </div>
  </div>
  {% for m in messages %}<div hidden data-flash="{{ m.tags }}">{{ m }}</div>{% endfor %}
  <script src="{% static 'js/app.js' %}?v=2"></script>
</body>
</html>
